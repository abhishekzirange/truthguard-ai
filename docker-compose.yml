version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: truthguard-postgres
    restart: always
    environment:
      POSTGRES_USER: truthguard
      POSTGRES_PASSWORD: truthguard_secure_password
      POSTGRES_DB: truthguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthguard -d truthguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://truthguard:truthguard_secure_password@db:5432/truthguard
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BIFROST_BASE_URL: ${BIFROST_BASE_URL:-https://api.bifrost.ai/v1}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      BIFROST_MODEL: ${BIFROST_MODEL:-gpt-4o-mini}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:

